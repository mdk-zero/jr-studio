<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#faf8f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1c1a19;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #d9d3ce;border-radius:12px;">
      <tr>
        <td style="padding:32px;">
          <p style="margin:0 0 4px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#873f52;">J&amp;R Studio</p>
          <h1 style="margin:0 0 16px;font-size:22px;font-weight:600;color:#662d38;">Reset your password</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#6b625d;">
            Click the button below to choose a new password. The link expires in one hour.
          </p>
          <p style="margin:0 0 24px;text-align:center;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
               style="display:inline-block;background:#662d38;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:13px 26px;border-radius:8px;">
              Choose a new password
            </a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.6;color:#6b625d;">
            If you did not request this, you can ignore this email and your password stays the same.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
